[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "RAG application with Anthropic Claude and ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
